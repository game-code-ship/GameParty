function connectDB(){

 const send=o=>{const j=JSON.stringify(o);open?ws.send(j):out.push(j)};

  (function conn(){
   ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
   ws.onopen=()=>{open=true;subs.forEach((s,sid)=>ws.send(JSON.stringify({t:'sub',sid,p:s.p,k:s.k})));out.splice(0).forEach(j=>ws.send(j));if(first){first=false;res({doc,collection:col})}else toast('Reconnected')};

  })();
 });
}

   return `<main><div class="lbl" style="margin-top:8px">${tm?TN[R.teams[me]]+' team · ':''}Your turn · <span id="tm"></span>s</div><div class="reveal" data-a="flip">${S.show?`<span class="badge">${IND[m.i]} · ${esc(m.y)}</span><div class="big">${esc(m.t)}</div><div class="mu">Starring</div><div>${esc(m.a)}</div><div class="mu" style="margin-top:10px">What makes it unique</div><div>${esc(m.s)}</div><div class="mu" style="margin-top:12px">Tap to hide</div>`:`<div class="big">Tap to see your movie</div><div class="mu">Don’t let anyone peek</div>`}</div><p>Act it out with no words. Then pick who guessed it.</p><div class="lbl">Who guessed it?</div><div class="pick">${others.map(p=>`<button class="${S.ch===p?'on':''}" data-a="chsel" data-p="${p}">${nm(p)}</button>`).join('')}<button class="${S.ch==='none'?'on':''}" data-a="chsel" data-p="none">Nobody guessed it</button></div><button class="btn a" data-a="chgo" ${S.ch?'':'disabled'}>Confirm</button></main>`}
  return `<main><div class="lbl" style="margin-top:8px">Round ${R.round} result</div><div class="win">${R.res.g?`${nm(R.res.g)} got it!`:'Nobody guessed it'}</div><p class="mu">${nm(R.res.a)} acted${R.res.g?' · +2 guesser, +1 actor'+(R.cfg.mode==='team'?` · ${TN[R.teams[R.res.a]]} team +3`:''):''}</p>${card}${tboard(R)}${hostBtns(true)}</main>`}
 if(g==='truths'){
  const w=R.writer,isW=w===me,vs=R.pl.filter(p=>p!==w),mt=S.A[me]?.k===R.k?S.A[me].t:null,hd=`<div class="lbl" style="margin-top:8px">Round ${R.round}`;
  if(ph==='write'){
   if(!isW)return `<main>${hd} · <span id="tm">${secs(R)}</span>s</div><div class="big">${nm(w)} is writing</div><p>Two truths and a lie, all about ${nm(w)}. Get ready to spot the lie!</p></main>`;
   if(did(R))return `<main><div class="big">Sent.</div><p class="mu">Waiting for the voting to begin…</p></main>`;
   return `<main>${hd} · Your turn · <span id="tm">${secs(R)}</span>s</div><div class="big">Two truths and a lie</div><p class="mu">Write three statements about yourself and tap “Lie” on the false one. Make them believable.</p>${[0,1,2].map(i=>`<div class="tt"><input type="text" maxlength="90" placeholder="Statement ${i+1}" autocomplete="off" value="${esc(S.tt[i])}" oninput="S.tt[${i}]=this.value;tcheck()"><button class="tool ${S.tli===i?'on':''}" data-a="tlie" data-i="${i}">Lie</button></div>`).join('')}<button class="btn a" id="tsend" data-a="tsend" ${S.tli>=0&&S.tt.every(x=>x.trim())?'':'disabled'}>Send</button></main>`}
  if(ph==='vote')return `<main>${hd} · <span id="tm">${secs(R)}</span>s</div><div class="big" style="font-size:30px">${isW?'Your friends are guessing':'Which one is the lie?'}</div><p class="mu">${isW?'Keep a poker face. You score +2 for every player you fool.':`Statements by <b>${nm(w)}</b>. Tap the one you think is the lie. You can change your vote until everyone has voted.`}</p><div class="pick">${R.st.map((s,i)=>isW?`<div class="mv">${esc(s)}</div>`:`<button class="${mt===i?'on':''}" data-a="tvote" data-i="${i}">${esc(s)}</button>`).join('')}</div>${waitN(vs)}</main>`;
  const r=R.res;
  if(r.skip)return `<main>${hd}</div><div class="win">${nm(w)} ran out of time</div><p class="mu">No statements this round.</p>${board(R)}${hostBtns(true)}</main>`;
  return `<main>${hd} · ${nm(w)}’s statements</div><div class="win">${r.n===0?'Nobody voted':r.fooled===0?'Nobody was fooled':r.fooled===r.n?`${nm(w)} fooled everyone!`:`${nm(w)} fooled ${r.fooled} of ${r.n}`}</div>${R.st.map((s,i)=>{const v=vs.filter(p=>r.v[p]===i).map(nm).join(', ');return `<div class="mv"><span class="badge">${i===R.lie?'The lie':'Truth'}</span><div style="margin-top:8px;font-size:18px">${esc(s)}</div><div class="mu" style="margin-top:6px">${v?(i===R.lie?'Spotted it: ':'Fooled: ')+v:'No votes'}</div></div>`}).join('')}<p class="mu">Correct guess +1 each · ${nm(w)} +${r.fooled*2}</p>${board(R)}${hostBtns(true)}</main>`}
 if(g==='fakefact'){
  const f=FACTS.find(x=>x.q===R.fq)||{q:R.fq,a:'?'},qb=`<div class="big" style="font-size:28px">${esc(f.q).replace('___','<span class="blank"></span>')}</div>`,hd=`<div class="lbl" style="margin-top:8px">Round ${R.round}`;
  if(ph==='fake'){
   if(did(R))return `<main><div class="big">Locked in.</div>${waiting}</main>`;
   return `<main>${hd} · Fake fact · <span id="tm">${secs(R)}</span>s</div>${qb}<p class="mu">Type a fake answer that could fool the others. If it matches the real one, you’ll be asked to try again.</p><input type="text" id="ff" maxlength="40" placeholder="Your fake answer" autocomplete="off" data-enter="fsend"><button class="btn a" data-a="fsend">Submit</button></main>`}
  if(ph==='pick'){const m=S.A[me]?.k===R.k?S.A[me].t:null;
   return `<main>${hd} · Which is real? · <span id="tm">${secs(R)}</span>s</div>${qb}<div class="pick">${R.opts.map((o,i)=>o.by.includes(me)?`<button class="fo" disabled><span>${esc(o.t)}</span><span class="mu" style="text-transform:none">your fake</span></button>`:`<button class="fo ${m===i?'on':''}" data-a="fpick" data-i="${i}">${esc(o.t)}</button>`).join('')}</div><p class="mu">Pick the real answer for +2. You can change your pick until everyone has picked.</p>${waitN(R.pl)}</main>`}
  const r=R.res,full=esc(f.q).replace('___',`<b>${esc(f.a)}</b>`);
  if(r.skip)return `<main>${hd} · answer</div><div class="win">Nobody wrote a fake</div><p>${full}</p>${board(R)}${hostBtns(true)}</main>`;
  const ord=R.opts.map((o,i)=>({o,n:R.pl.filter(p=>r.v[p]===i)})).sort((a,b)=>(a.o.by.length>0)-(b.o.by.length>0)||b.n.length-a.n.length),gain=R.pl.filter(p=>r.d[p]).sort((a,b)=>r.d[b]-r.d[a]);
  return `<main>${hd} · answer</div><p style="font-size:22px;margin:8px 0 14px">${full}</p>${ord.map(x=>`<div class="mv"><span class="badge">${x.o.by.length?'Fake by '+x.o.by.map(nm).join(', '):'Real answer'}</span><div class="big fo" style="font-size:24px">${esc(x.o.t)}</div><div class="mu">${x.n.length?(x.o.by.length?'Fooled: ':'Found it: ')+x.n.map(nm).join(', '):'Nobody picked this'}</div></div>`).join('')}${gain.length?`<div class="lbl">This round</div>${gain.map(p=>`<div class="row"><span>${nm(p)}</span><b>+${r.d[p]}</b></div>`).join('')}`:''}${board(R)}${hostBtns(true)}</main>`}
 if(g==='taboo'){
  const tm=R.tm,mate=R.teams[me]===tm,isD=R.desc===me,lg=tlog(R),cur=TABOO[R.cards[lg.length]],hd=`<div class="lbl" style="margin-top:8px">Round ${R.round} · ${TN[tm]} team`,
   card=c=>c?`<div class="tabo"><div class="w">${esc(c.w)}</div><ul>${c.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
  if(ph==='ready')return `<main>${hd}’s turn</div><div class="big">${isD?'You’re describing':nm(R.desc)+' is describing'}</div><p>${isD?'Get your team ready, then tap start. The timer begins straight away.':mate?'Get ready to guess. Don’t look at the describer’s phone.':'You’re the watchers. Once the turn starts you’ll see each card. Shout “BUZZ!” if the describer says a banned word.'}</p>${isD?`<button class="btn a" data-a="tgo" ${did(R)?'disabled':''}>${did(R)?'Starting…':'Start turn'}</button>`:''}${tboard(R)}${isHost()&&!isD?`<button class="btn o" data-a="nextRound">Skip this turn</button>`:''}</main>`;
  if(ph==='play'){
   const g1=cnt(lg,'g'),b1=cnt(lg,'b'),s1=cnt(lg,'s'),net=g1-b1,out=lg.length>=R.cards.length,
    stat=`<p class="mu">✓ ${g1} · ✗ ${b1} · Turn score <b>${net>0?'+':''}${net}</b></p>`,top=`${hd} · <span id="tm">${secs(R)}</span>s</div>`;
   if(isD)return `<main>${top}${out?'<div class="big">Out of cards</div>':card(cur)}${stat}<div class="tbtn"><button class="btn ok" data-a="tb" data-o="g" ${out?'disabled':''}>Got it +1</button><button class="btn a" data-a="tb" data-o="b" ${out?'disabled':''}>Buzz −1</button></div><button class="btn o" data-a="tb" data-o="s" ${out||s1>=3?'disabled':''}>Skip (${3-s1} left)</button></main>`;
   if(mate)return `<main>${top}<div class="big">${nm(R.desc)} is describing</div><p>Shout your guesses! Don’t look at the describer’s phone.</p>${stat}${tboard(R)}</main>`;
   return `<main>${top}<div class="lbl" style="margin-top:8px">Watch for banned words</div>${card(cur)}<p>Shout “BUZZ!” if ${nm(R.desc)} says the word or a banned word. ${nm(R.desc)} taps Buzz.</p>${stat}</main>`}
  const r=R.res,l2=r.log||'';
  return `<main>${hd}</div><div class="win">${r.net>0?'+':''}${r.net} for ${TN[tm]}</div><p class="mu">${nm(R.desc)} described · ✓ ${cnt(l2,'g')} · ✗ ${cnt(l2,'b')} · skipped ${cnt(l2,'s')}</p>${[...l2].map((c,i)=>`<div class="row"><span>${esc(TABOO[R.cards[i]].w)}</span><span>${c==='g'?'Got it +1':c==='b'?'Buzzed −1':'Skipped'}</span></div>`).join('')}${tboard(R)}${hostBtns(true)}</main>`}
 if(ph==='vote')return `<main><div class="lbl" style="margin-top:8px">Round ${R.round}</div><div class="big">${esc(R.prompt)}</div>${S.sub===R.k?'':''}${pickList(R.pl,me)}${waitN(R.pl)}</main>`;
 const mx=R.res[0]?.n||1;
 return `<main><div class="lbl" style="margin-top:8px">${esc(R.prompt)}</div>${R.res.map(r=>`<div style="padding:10px 0"><div style="display:flex;justify-content:space-between"><span>${nm(r.p)}</span><b>${r.n}</b></div><div class="bar2" style="width:${r.n/mx*100}%"></div></div>`).join('')}${board(R)}${hostBtns(true)}</main>`;
}
/* ---------- widgets that must survive re-renders ---------- */
function markTools(){document.querySelectorAll('.tool').forEach(b=>{const d=b.dataset;b.classList.toggle('on',(d.a==='tool'&&d.t===S.tool)||(d.a==='col'&&d.c===S.col&&S.tool==='pen')||(d.a==='sz'&&+d.s===S.sz))})}
function initCv(){
 const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,480,480);x.lineCap=x.lineJoin='round';
 if(S.artData){const i=new Image;i.onload=()=>x.drawImage(i,0,0,480,480);i.src=S.artData}
 let d=false,l;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*480/r.width,(e.clientY-r.top)*480/r.height]};
 const dot=(a,b)=>{x.strokeStyle=S.tool==='eraser'?'#fff':S.col;x.lineWidth=S.tool==='eraser'?S.sz*3:S.sz;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()};
 c.onpointerdown=e=>{d=true;l=pt(e);c.setPointerCapture(e.pointerId);dot(l,[l[0]+.1,l[1]])};
 c.onpointermove=e=>{if(!d)return;const p=pt(e);dot(l,p);l=p};
 c.onpointerup=c.onpointercancel=()=>{if(d){d=false;S.artData=c.toDataURL('image/jpeg',.6)}};
}
function paintSl(){const[h,s,v]=S.pick;$('#pv').style.background=css(S.pick);
 $('#s1').style.background=`linear-gradient(90deg,${css([h,0,v])},${css([h,100,v])})`;$('#s2').style.background=`linear-gradient(90deg,#000,${css([h,s,100])})`}
function onSl(i,v){S.pick[i]=+v;paintSl()}
function initSl(){$('#s0').style.background='linear-gradient(90deg,'+[0,60,120,180,240,300,360].map(h=>css([h,100,100])).join(',')+')';[0,1,2].forEach(i=>$('#s'+i).value=S.pick[i]);paintSl()}
function after(){
 if($('#cv'))initCv();if($('#s0'))initSl();markTools();
 if(S.R&&S.R.phase==='lobby'&&window.QRCode&&$('#qr'))new QRCode($('#qr'),{text:location.href.split('#')[0]+'#'+S.code,width:140,height:140});
}
function render(){
 if(!$('#app'))return;const R=S.R;let h;
 if(!S.code||!R)h=home();
 else{const g=G(R.game);
  h=`<div class="bar"><b>${g.n}</b><span><span class="mu">${S.code}</span><button class="btn s o" data-a="leave">Exit</button></span></div>`;
  h+=R.phase==='lobby'?lobby():R.phase==='over'?over():R.game==='mafia'?mafiaView():R.game==='imposter'?imposterView():partyView();
 }
 const key=(S.code||'')+(R?R.phase+R.k:''),ae=document.activeElement;
 if(ae&&ae.tagName==='INPUT'&&(ae.id==='nm'||ae.id==='code'||key===render.key))return;
 if(h===render.h)return;const y=window.scrollY;
 $('#app').classList.toggle('noanim',key===render.key);
 $('#app').innerHTML=h;window.scrollTo(0,y);render.h=h;render.key=key;after();
}
