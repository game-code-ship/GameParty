<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Party games</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0e8;--card:#fbf9f4;--ink:#161616;--mu:#77736a;--line:#d9d4c7;--acc:#d9412b;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#121211;--card:#1a1a18;--ink:#ecebe6;--mu:#8c8a82;--line:#2e2d2a;--acc:#ff6a4d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 'Bricolage Grotesque',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:20px 20px 60px}
#app:not(.noanim) main{animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h1{font-size:44px;line-height:1;letter-spacing:-.03em;margin:28px 0 8px;font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.bar b{font-size:18px}.bar>span{display:flex;align-items:center;gap:10px;white-space:nowrap}
.mu{color:var(--mu);font-size:14px}.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:26px 0 8px}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 10px}
input[type=text]{width:100%;height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:18px;outline:none}input[type=text]:focus{border-color:var(--ink)}
.btn{display:block;width:100%;height:52px;border-radius:12px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:600 16px inherit;font-family:inherit;margin:10px 0;cursor:pointer}
.btn:active{transform:scale(.98)}.btn.o{background:transparent;color:var(--ink)}.btn.a{background:var(--acc);border-color:var(--acc);color:#fff}.btn[disabled]{opacity:.35;pointer-events:none}.btn.s{width:auto;height:34px;padding:0 14px;margin:0;font-size:14px}
.g{display:flex;gap:14px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer}.g:active{opacity:.6}.g i{font-style:normal;color:var(--mu);width:20px}.g b{font-size:22px;letter-spacing:-.01em}.g span{display:block;color:var(--mu);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin:0 6px 6px 0;font-size:15px}.chip.me{border-color:var(--ink)}.chip.dead{color:var(--mu);text-decoration:line-through}
.code{font:600 64px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;margin:6px 0}#qr{margin:14px 0}#qr img,#qr canvas{background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line)}
.step{display:flex;gap:14px;align-items:center}.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 20px inherit;cursor:pointer}.step b{min-width:28px;text-align:center}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cat{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;font-size:14px}.cat.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick button{display:flex;width:100%;justify-content:space-between;padding:14px 16px;margin:0 0 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-size:17px;cursor:pointer}.pick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.reveal{border:1px dashed var(--mu);border-radius:16px;padding:40px 16px;text-align:center;cursor:pointer;user-select:none;margin:16px 0}
.note{border-left:3px solid var(--acc);padding:4px 0 4px 12px;margin:16px 0}.win{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:18px 0 6px}
#cv{width:100%;aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;display:block;margin-top:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tool{height:38px;min-width:38px;padding:0 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}.tool.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tool.sw{width:38px;padding:0;border-radius:50%}.tool.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.sl{display:block}.sl input{width:100%;height:30px;-webkit-appearance:none;appearance:none;border-radius:8px;outline:none;margin:4px 0 8px;border:1px solid var(--line)}.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:38px;border-radius:6px;background:#fff;border:2px solid #111}.sl input::-moz-range-thumb{width:18px;height:34px;border-radius:6px;background:#fff;border:2px solid #111}
.swatch{height:150px;border-radius:14px;border:1px solid var(--line)}.sw2{display:inline-block;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);vertical-align:middle;margin-right:8px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gal img{width:100%;display:block;border:1px solid var(--line);border-radius:10px;background:#fff}.gal small{display:block;color:var(--mu);font-size:13px;line-height:1.3;margin-top:4px}
.bar2{height:6px;background:var(--ink);border-radius:3px;margin-top:4px}
#pcv{width:100%;aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;display:block;margin-top:10px}
.phead{display:flex;justify-content:space-between;align-items:center;padding-top:10px;font-size:14px;color:var(--mu)}.phead b{color:var(--ink);font-size:22px}
.pword{margin-top:6px;text-align:center}.pword .lbl{margin:6px 0}
.hint{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 5px;font:700 28px/1 ui-monospace,Menlo,monospace;text-transform:uppercase}
.lt{display:inline-block;min-width:22px;height:36px;text-align:center;border-bottom:3px solid var(--ink)}.lt.lk{border-color:var(--acc);color:var(--acc)}.sp{display:inline-block;width:16px}
.chat{height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 12px;font-size:15px}.chat.big{height:60vh}
.msg{padding:2px 0;word-break:break-word}.msg b{margin-right:4px}.msg b.me{color:var(--acc)}.msg.sys{color:var(--mu);font-style:italic}
.cin{display:flex;gap:8px;margin-top:8px}.cin .btn{width:84px;margin:0;flex:none}.crow{display:flex;justify-content:space-between;align-items:center}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--bg);border:0;font-family:inherit;font-weight:600;font-size:14px;display:none;align-items:center;justify-content:center;z-index:8;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#fab i{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font-size:12px;line-height:20px;font-style:normal;text-align:center;display:none;padding:0 5px}
#fpanel{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:65vh;background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;z-index:10;display:none;flex-direction:column;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#fpanel .chat{flex:1;height:auto;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:9;font-size:15px}
</style></head><body><div id="app"></div><div id="toast"></div>
<button id="fab" data-a="fopen">Chat<i id="fbadge"></i></button>
<div id="fpanel"><div class="crow"><b>Chat</b><button class="btn s o" data-a="fclose">Close</button></div><div class="chat" id="fchat"></div><div class="cin"><input type="text" id="fci" maxlength="80" placeholder="Say something" autocomplete="off"><button class="btn a" data-a="csend" data-i="fci">Send</button></div></div>

 });

  if(ph==='show')return `<main><div class="lbl" style="margin-top:8px">Memorize this color · <span id="tm"></span>s</div><div class="swatch" style="height:320px;background:${css(R.tc)}"></div></main>`;
  if(ph==='pick')return S.sub===R.k?`<main><div class="big">Locked in.</div>${waiting}</main>`:`<main><div class="lbl" style="margin-top:8px">Recreate it · <span id="tm"></span>s</div><div class="swatch" id="pv"></div>${sl(0,'Hue',360)}${sl(1,'Saturation',100)}${sl(2,'Brightness',100)}<button class="btn a" data-a="cpick">Lock in</button></main>`;
  return `<main><div class="lbl" style="margin-top:8px">Round ${R.round} · target</div><div class="swatch" style="background:${css(R.tc)}"></div><div class="lbl">Accuracy</div>${R.res.map((r,i)=>`<div class="row"><span><span class="sw2" style="background:${r.c?css(r.c):'transparent'}"></span>${i+1}. ${nm(r.p)}</span><b>${r.acc.toFixed(1)}%</b></div>`).join('')}${board(R)}${hostBtns(true)}</main>`;
 }
 if(ph==='vote')return `<main><div class="lbl" style="margin-top:8px">Round ${R.round}</div><div class="big">${esc(R.prompt)}</div>${S.sub===R.k?'':''}${pickList(R.pl,me)}${waitN(R.pl)}</main>`;
 const mx=R.res[0]?.n||1;
 return `<main><div class="lbl" style="margin-top:8px">${esc(R.prompt)}</div>${R.res.map(r=>`<div style="padding:10px 0"><div style="display:flex;justify-content:space-between"><span>${nm(r.p)}</span><b>${r.n}</b></div><div class="bar2" style="width:${r.n/mx*100}%"></div></div>`).join('')}${board(R)}${hostBtns(true)}</main>`;
}
/* ---------- widgets that must survive re-renders ---------- */
function markTools(){document.querySelectorAll('.tool').forEach(b=>{const d=b.dataset;b.classList.toggle('on',(d.a==='tool'&&d.t===S.tool)||(d.a==='col'&&d.c===S.col&&S.tool==='pen')||(d.a==='sz'&&+d.s===S.sz))})}
function initCv(){
 const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,480,480);x.lineCap=x.lineJoin='round';
 if(S.artData){const i=new Image;i.onload=()=>x.drawImage(i,0,0,480,480);i.src=S.artData}
 let d=false,l;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*480/r.width,(e.clientY-r.top)*480/r.height]};
 const dot=(a,b)=>{x.strokeStyle=S.tool==='eraser'?'#fff':S.col;x.lineWidth=S.tool==='eraser'?S.sz*3:S.sz;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()};
 c.onpointerdown=e=>{d=true;l=pt(e);c.setPointerCapture(e.pointerId);dot(l,[l[0]+.1,l[1]])};
 c.onpointermove=e=>{if(!d)return;const p=pt(e);dot(l,p);l=p};
 c.onpointerup=c.onpointercancel=()=>{if(d){d=false;S.artData=c.toDataURL('image/jpeg',.6)}};
}
function paintSl(){const[h,s,v]=S.pick;$('#pv').style.background=css(S.pick);
 $('#s1').style.background=`linear-gradient(90deg,${css([h,0,v])},${css([h,100,v])})`;$('#s2').style.background=`linear-gradient(90deg,#000,${css([h,s,100])})`}
function onSl(i,v){S.pick[i]=+v;paintSl()}
function initSl(){$('#s0').style.background='linear-gradient(90deg,'+[0,60,120,180,240,300,360].map(h=>css([h,100,100])).join(',')+')';[0,1,2].forEach(i=>$('#s'+i).value=S.pick[i]);paintSl()}
function after(){
 if($('#cv'))initCv();if($('#s0'))initSl();markTools();pictAfter();
 if(S.R&&S.R.phase==='lobby'&&window.QRCode&&$('#qr'))new QRCode($('#qr'),{text:location.href.split('#')[0]+'#'+S.code,width:140,height:140});
}
/* ---------- pictionary ---------- */
const P={st:[],chat:[],si:0,cur:null,code:null,ud:null,tk:'',gq:0,gInit:0};
const lt=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');
const lp=n=>`rooms/${S.code}/log/${n}`;
const isDrawer=()=>!!S.R&&S.R.game==='pict'&&S.R.phase==='draw'&&S.R.drawer===S.id;
const PTOOLS=TOOLS.replace('<button class="tool" data-a="clr">Clear</button>','<button class="tool" data-a="pundo">Undo</button><button class="tool" data-a="pclr">Clear</button>');
const chatBox=()=>{const R=S.R,ph=R.phase==='draw'?(R.drawer===S.id?'Chat (don’t reveal the word)':'Type your guess'):'Say something';
 return `<div class="crow"><div class="lbl">Chat</div><button class="btn s o" data-a="cexp">Expand</button></div><div class="chat" id="chat"></div><div class="cin"><input type="text" id="ci" maxlength="80" placeholder="${ph}" autocomplete="off"><button class="btn a" data-a="csend">Send</button></div>`};
function pictSync(){
 const R=S.R,want=R&&R.game==='pict'?S.code:null;
 if(want!==P.code){pictOff();if(want){P.code=want;
  P.ud=[db.logSub(lp('draw'),onDraw)];
  if(isHost())P.ud.push(db.logSub(lp('guess'),onGuess))}}
 if(want){const tk=R.g+':'+R.turn;if(tk!==P.tk){P.tk=tk;P.st=[];P.cur=null}}
}
function pictOff(){P.ud&&P.ud.forEach(u=>u());P.ud=null;P.code=null;P.st=[];P.cur=null;P.tk='';P.gq=0;P.gInit=0}
/* drawing: strokes are replayed from a shared log so late joiners see everything */
const pxCtx=()=>{const c=$('#pcv');return c&&c.getContext('2d')};
function strokePath(x,s){x.strokeStyle=s.c;x.lineWidth=s.w;x.lineCap=x.lineJoin='round';x.beginPath();const p=s.p;x.moveTo(p[0],p[1]);if(p.length<4)x.lineTo(p[0]+.1,p[1]);else for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);x.stroke()}
function pRedraw(){const x=pxCtx();if(!x)return;x.fillStyle='#fff';x.fillRect(0,0,480,480);P.st.forEach(s=>strokePath(x,s))}
function pApply(it,live){
 const x=live?pxCtx():null;
 if(it.x){P.st=[];if(live)pRedraw();return}
 if(it.u){P.st.pop();if(live)pRedraw();return}
 if(!Array.isArray(it.p)||it.p.length<2||it.p.length>400||!it.p.every(Number.isFinite))return;
 const l=P.st[P.st.length-1];
 if(l&&l.i===it.i&&l.a===it.a){l.p.push(...it.p.slice(2));if(x)strokePath(x,{c:l.c,w:l.w,p:it.p})}
 else{const s={i:it.i,a:it.a,c:/^#[0-9a-f]{6}$/i.test(it.c)?it.c:'#111111',w:Math.min(40,Math.max(1,+it.w||4)),p:it.p.slice()};P.st.push(s);if(x)strokePath(x,s)}
}
function onDraw(m){
 if(m.full){P.st=[];P.cur=null;m.items.forEach(it=>pApply(it,false));pRedraw()}
 else m.items.forEach(it=>{if(it.a!==S.id)pApply(it,true)});
}
function pFlush(){const s=P.cur;if(!s)return;const n=s.p.length;if(n<=s.sn)return;const from=Math.max(0,s.sn-2);s.sn=n;
 db.logAdd(lp('draw'),{a:S.id,i:s.i,c:s.c,w:s.w,p:s.p.slice(from)})}
setInterval(pFlush,80);
function initPcv(){
 const c=$('#pcv');pRedraw();if(!isDrawer())return;
 let d=false;const pt=e=>{const r=c.getBoundingClientRect();return[Math.round((e.clientX-r.left)*960/r.width)/2,Math.round((e.clientY-r.top)*960/r.height)/2]};
 c.onpointerdown=e=>{e.preventDefault();d=true;c.setPointerCapture(e.pointerId);const er=S.tool==='eraser';
  const s={i:++P.si,a:S.id,c:er?'#ffffff':S.col,w:er?S.sz*3:S.sz,p:pt(e),sn:0};P.cur=s;P.st.push(s);strokePath(c.getContext('2d'),s);pFlush()};
 c.onpointermove=e=>{if(!d||!P.cur)return;const s=P.cur,x=c.getContext('2d');
  for(const ev of (e.getCoalescedEvents?e.getCoalescedEvents():[e])){const p=pt(ev),n=s.p.length,lx=s.p[n-2],ly=s.p[n-1];
   if(Math.hypot(p[0]-lx,p[1]-ly)<1.5)continue;s.p.push(p[0],p[1]);strokePath(x,{c:s.c,w:s.w,p:[lx,ly,p[0],p[1]]})}};
 c.onpointerup=c.onpointercancel=()=>{if(d){d=false;pFlush();P.cur=null}};
}
/* chat */
function onChat(m){const n=m.full?0:m.items.filter(x=>!x.s&&x.a!==S.id).length;
 if(m.full)P.chat=m.items.slice();else P.chat.push(...m.items);if(P.chat.length>500)P.chat.splice(0,P.chat.length-500);
 if(n&&$('#fpanel').style.display!=='flex'){S.unread=(S.unread||0)+n;updBadge()}paintChat()}
function updBadge(){const b=$('#fbadge');b.textContent=S.unread>99?'99+':S.unread||'';b.style.display=S.unread?'block':'none'}
function fillChat(el){if(!el)return;
 const stick=!el.dataset.i||el.scrollTop+el.clientHeight>=el.scrollHeight-40;
 el.innerHTML=P.chat.length?P.chat.map(m=>m.s?`<div class="msg sys">${esc(m.t)}</div>`:`<div class="msg"><b class="${m.a===S.id?'me':''}">${esc(m.n)}</b>${esc(m.t)}</div>`).join(''):'<div class="mu">No messages yet.</div>';
 if(el.id==='chat')el.classList.toggle('big',!!S.cexp);el.dataset.i=1;if(stick)el.scrollTop=el.scrollHeight}
function paintChat(){fillChat($('#chat'));fillChat($('#fchat'))}
function chatSync(){if(S.code&&!P.cc)P.cc=db.logSub(lp('chat'),onChat)}
function chatOff(){P.cc&&P.cc();P.cc=null;P.chat=[];S.unread=0;updBadge();paintChat()}
function fabShow(on){const o=$('#fpanel').style.display==='flex';$('#fab').style.display=on&&!o?'flex':'none';if(!on)$('#fpanel').style.display='none'}
function paintHint(){
 const el=$('#pword'),R=S.R;if(!el||R.phase!=='draw')return;
 const me=S.id,dr=R.drawer===me,got=!!(R.solved&&R.solved[me]!=null),full=dr||got,w=R.word||'';
 let i=0,h='';for(const ch of w){if(/[a-z]/i.test(ch)){const lk=(R.lk||'')[i++]==='1';h+=`<span class="lt ${lk?'lk':''}">${full||lk?esc(ch):''}</span>`}
  else if(ch===' ')h+='<span class="sp"></span>';else h+=`<span class="lt">${esc(ch)}</span>`}
 const lbl=dr?'Draw this':got?'You got it!':`Guess the word · ${lt(w).length} letters`;
 const skip=dr&&!R.skip&&!Object.keys(R.solved||{}).length?`<button class="btn s o" style="margin-top:10px" data-a="pskip">New word</button>`:'';
 const sig=lbl+h+skip;if(el.dataset.sig!==sig){el.dataset.sig=sig;el.innerHTML=`<div class="lbl">${lbl}</div><div class="hint">${h}</div>${skip}`}
}
function paintPlayers(){
 const el=$('#pplayers'),R=S.R;if(!el||R.phase!=='draw')return;
 el.innerHTML=(R.pl||[]).filter(p=>S.P[p]).map(p=>`<span class="chip ${p===S.id?'me':''}">${nm(p)}${p===R.drawer?' · drawing':R.solved&&R.solved[p]!=null?' ✓':''} · ${(R.scores||{})[p]||0}</span>`).join('')}
function paintPict(){
 const R=S.R;if(!R||R.game!=='pict')return;
 paintHint();paintPlayers();paintChat();
 const t=$('#tm');if(t&&R.end)t.textContent=Math.max(0,Math.ceil((R.end-Date.now())/1000))}
function pictAfter(){if($('#pcv'))initPcv();paintPict()}
/* views */
function pictView(){
 const R=S.R,me=S.id,ph=R.phase,K=`data-k="${esc(R.k)}"`;
 if(ph==='over'){const sc=R.scores||{},ids=Object.keys(S.P).sort((a,b)=>(sc[b]||0)-(sc[a]||0)),top=ids.length&&(sc[ids[0]]||0)>0?ids.filter(p=>(sc[p]||0)===(sc[ids[0]]||0)):[];
  return `<main ${K}><div class="win">${top.length?top.map(nm).join(' & ')+(top.length>1?' win':' wins'):'Game over'}</div>${board(R)}${hostBtns(false)}${chatBox()}</main>`}
 if(ph==='tr'){
  const rows=R.pl.filter(p=>p!==R.drawer&&S.P[p]).map(p=>`<div class="row"><span>${nm(p)}</span><span>${R.solved&&R.solved[p]!=null?'+'+R.solved[p]:'no guess'}</span></div>`).join('');
  return `<main ${K}><div class="lbl" style="margin-top:8px">The word was · next turn in <span id="tm"></span>s</div><div class="big">${esc(R.word)}</div><p class="mu">Drawn by ${nm(R.drawer)}</p><canvas id="pcv" width="480" height="480"></canvas><div class="lbl">This turn</div>${rows}${board(R)}${isHost()?`<button class="btn o" data-a="pnext">Next turn now</button>`:''}${chatBox()}</main>`}
 const dr=R.drawer===me;
 return `<main ${K}><div class="phead"><span>${dr?'You are drawing':nm(R.drawer)+' is drawing'} · round ${R.round} of ${R.cfg.rounds}</span><b><span id="tm"></span>s</b></div><div id="pword" class="pword"></div><canvas id="pcv" width="480" height="480"></canvas>${dr?PTOOLS:''}<div class="lbl">Players</div><div id="pplayers"></div>${chatBox()}</main>`;
}
/* referee: runs on the host device. Guessers write to a private log; the host judges and posts to chat,
   so a correct guess never appears in the chat as text. */
let H={k:''};
function hs(){const R=S.R;if(H.k!==R.k)H={k:R.k,solved:{...(R.solved||{})},lk:(R.lk||'').split(''),scores:{...(R.scores||{})}};return H}
const chatPost=o=>db.logAdd(lp('chat'),{ts:Date.now(),...o});
function onGuess(m){
 if(m.full&&!P.gInit){P.gInit=1;P.gq=Math.max(0,...m.items.map(x=>x.q||0));return}
 m.items.forEach(it=>{if(it.q>P.gq){P.gq=it.q;try{pictGuess(it)}catch(e){console.error(e)}}})}
function newWord(R){let used=R.used||[],pool=WORDS.filter(w=>!used.includes(w));if(!pool.length){pool=WORDS;used=[]}const word=rnd(pool);return{word,used:[...used,word]}}
function pictGuess(it){
 const R=S.R;if(!R||R.game!=='pict'||!S.P[it.a])return;
 const a=it.a,name=S.P[a].name,live=R.phase==='draw'&&!S.busy,H=hs();
 if(it.cmd==='skip'){
  if(!live||a!==R.drawer||R.skip||Object.keys(H.solved).length)return;
  const nw=newWord(R);H.lk='0'.repeat(lt(nw.word).length).split('');R.word=nw.word;
  db.logAdd(lp('draw'),{x:1,a:S.id});chatPost({s:1,t:`${name} swapped the word. Drawing was cleared.`});
  return upd({word:nw.word,used:nw.used,lk:H.lk.join(''),skip:1})}
 const t=String(it.t||'').trim().slice(0,80);if(!t)return;
 const inGame=live&&R.pl.includes(a)&&a!==R.drawer&&H.solved[a]==null;
 if(!inGame){ // plain chat; never let the answer leak
  if(R.phase==='draw'&&lt(t).includes(lt(R.word)))return;
  return chatPost({a,n:name,t})}
 if(close(t,R.word)){
  const left=Math.max(0,R.end-Date.now()),pts=1+Math.ceil(4*left/(R.cfg.secs*1000));
  H.solved[a]=pts;H.scores[a]=(H.scores[a]||0)+pts;H.scores[R.drawer]=(H.scores[R.drawer]||0)+2;
  chatPost({s:1,t:`${name} guessed the word! +${pts}`});
  const need=R.pl.filter(p=>p!==R.drawer&&S.P[p]);
  if(need.every(p=>H.solved[p]!=null)){S.busy=true;return endTurn()}
  return upd({solved:H.solved,scores:H.scores})}
 chatPost({a,n:name,t});
 const w=lt(R.word);let found=null;
 for(const g of t.toLowerCase().split(/\s+/).map(lt)){if(g.length<3||g===w)continue;let i=w.indexOf(g),hit=false;
  while(i>=0){for(let j=i;j<i+g.length;j++)if(H.lk[j]!=='1'){H.lk[j]='1';hit=true}i=w.indexOf(g,i+1)}
  if(hit&&!found)found=g}
 if(found){H.scores[a]=(H.scores[a]||0)+1;chatPost({s:1,t:`“${found}” is part of the word! +1 for ${name}`});
  return upd({lk:H.lk.join(''),scores:H.scores})}
}
function endTurn(){const R=S.R,H=hs();chatPost({s:1,t:`The word was “${R.word}”.`});
 return upd({phase:'tr',k:`${R.g}:${R.turn}:r`,end:Date.now()+7000,solved:H.solved,scores:H.scores,lk:'1'.repeat(lt(R.word).length)})}
function pictTurn(R,t,x={}){
 const nw=newWord(R),dr=R.order[t],rd=Math.floor(t/R.pl.length)+1;
 db.logAdd(lp('draw'),{x:1,a:S.id});
 chatPost({s:1,t:`${S.P[dr]?.name||'?'} is drawing · round ${rd} of ${R.cfg.rounds}`});
 return upd({...x,turn:t,drawer:dr,word:nw.word,used:nw.used,lk:'0'.repeat(lt(nw.word).length),solved:{},skip:0,round:rd,phase:'draw',k:`${R.g}:${t}:d`,end:Date.now()+R.cfg.secs*1000})}
function nextTurn(){const R=S.R;let t=R.turn+1;while(t<R.order.length&&!S.P[R.order[t]])t++;
 if(t>=R.order.length){chatPost({s:1,t:'Game over!'});return upd({phase:'over',k:`${R.g}:over`})}
 return pictTurn(R,t)}
function pictStart(){
 const R=S.R,ids=shuf(Object.keys(S.P)),g=Date.now(),order=[];for(let r=0;r<R.cfg.rounds;r++)order.push(...ids);
 return pictTurn({...R,g,pl:ids,order,used:[]},0,{g,pl:ids,order,scores:{}})}
function pictTick(R,now){
 if(R.phase==='draw'&&R.end&&now>=R.end){S.busy=true;return endTurn()}
 if(R.phase==='tr'&&R.end&&now>=R.end){S.busy=true;return nextTurn()}
}

function render(){
 if(!$('#app'))return;const R=S.R;let h;fabShow(!!(S.code&&R));
 if(!S.code||!R)h=home();
 else{const g=G(R.game);
  h=`<div class="bar"><b>${g.n}</b><span><span class="mu">${S.code}</span><button class="btn s o" data-a="leave">Exit</button></span></div>`;
  h+=R.phase==='lobby'?lobby():R.game==='pict'?pictView():R.phase==='over'?over():R.game==='mafia'?mafiaView():R.game==='imposter'?imposterView():partyView();
 }
 const key=(S.code||'')+(R?R.phase+R.k:''),ae=document.activeElement;
 if(ae&&ae.tagName==='INPUT'&&ae.closest('#app')&&(ae.id==='nm'||ae.id==='code'||key===render.key))return;
 if(h===render.h)return;const y=window.scrollY;
 $('#app').classList.toggle('noanim',key===render.key);
 $('#app').innerHTML=h;window.scrollTo(0,y);render.h=h;render.key=key;after();
}
</script></body></html>
